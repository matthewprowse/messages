# CI: lint, typecheck and test every workspace on each push and pull request.
# Run the same checks locally with `pnpm check`. deploy/release.sh refuses a commit unless every job here passed on it.
# Third-party actions are pinned by commit (the tag is in the comment), so a moved or hijacked tag cannot change what
# runs. To move one: git ls-remote https://github.com/<owner>/<action> refs/tags/<tag> and use the commit it names
# (the ^{} line for an annotated tag).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read only: no job here writes to the repo, packages or deployments.
permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The installed WhatsApp library must be the reviewed one (version and WASM hash), and no high advisory in production deps.
      - run: node --test scripts/check-baileys.test.mjs scripts/updates-draft.test.mjs
      - run: node scripts/check-baileys.mjs
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/ai/requirements*.txt
      # The hash lock when there is one (deploy/lock-ai-requirements.sh), as the image installs it.
      - run: if [ -f requirements.lock.txt ]; then pip install --require-hashes --no-deps -r requirements.lock.txt; else pip install -r requirements.txt; fi
      - run: python -m unittest discover -s tests -t .
      # Every package the three images install, against the public advisory databases. The connectors' trees run with
      # the service role key and KMS access, so a known hole in one of them fails the build.
      - run: pip install "pip-audit>=2.9,<3"
      - run: pip-audit --strict --progress-spinner off -r requirements.lock.txt -r requirements-instagram.lock.txt -r requirements-icloud-reminders.lock.txt

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/linkedin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: apps/linkedin/go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      # Known vulnerabilities reachable from the helper's code (golang.org/x/vuln). Pinned to a release, like the actions.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - run: govulncheck ./...

  # The images must build (nothing is pushed). Catches a lockfile that no longer matches, a missing file in the
  # build context and a broken base image pin. Release images are built from a tag by release-images.yml (docs/RUNBOOK.md).
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/ai/Dockerfile
          push: false
          cache-from: type=gha,scope=ai
          cache-to: type=gha,scope=ai,mode=max
