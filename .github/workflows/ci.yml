# CI: lint, typecheck and test every workspace on each push and pull request.
# Run the same checks locally with `pnpm check`.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The installed WhatsApp library must be the reviewed one (version and WASM hash), and no high advisory in production deps.
      - run: node --test scripts/check-baileys.test.mjs scripts/updates-draft.test.mjs
      - run: node scripts/check-baileys.mjs
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/ai/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/linkedin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/linkedin/go.mod
      - run: go build ./...

  # The images must build (nothing is pushed). Catches a lockfile that no longer matches, a missing file in the
  # build context and a broken base image pin. Releases are built by a pinned pipeline from a tagged commit (docs/RUNBOOK.md).
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/worker/Dockerfile
          push: false
          cache-from: type=gha,scope=worker
          cache-to: type=gha,scope=worker,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/ai/Dockerfile
          push: false
          cache-from: type=gha,scope=ai
          cache-to: type=gha,scope=ai,mode=max
