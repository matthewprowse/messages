# Release images: builds the four worker images from a release tag (vX.Y.Z) on GitHub's runners instead of on the
# production VM, and records each image's digest in the run summary and a digests.txt artifact.
#
# Pushing is off until the owner sets it up (docs/RUNBOOK.md, "Images Built In CI"): with the repository variables
# IMAGE_REGISTRY (for example africa-south1-docker.pkg.dev/messages-keys/konva), GCP_WORKLOAD_IDENTITY_PROVIDER and
# GCP_IMAGE_PUSHER set, the images are pushed there with a short-lived token from Workload Identity Federation (no key
# file), and deploy/release.sh with REGISTRY set deploys them by digest. Until then each image is still built and its
# digest recorded, so a broken release build shows up on the tag.
name: Release Images

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # id-token only for the Workload Identity exchange; it grants nothing in the repo.
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: konva-worker, file: apps/worker/Dockerfile, extra: "" }
          - { name: konva-ai, file: apps/ai/Dockerfile, extra: "" }
          - { name: konva-ai-instagram, file: apps/ai/Dockerfile, extra: requirements-instagram.txt }
          - { name: konva-ai-icloud-reminders, file: apps/ai/Dockerfile, extra: requirements-icloud-reminders.txt }
    env:
      REGISTRY: ${{ vars.IMAGE_REGISTRY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - id: gcp
        if: vars.IMAGE_REGISTRY != ''
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2.1.13
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_IMAGE_PUSHER }}
          token_format: access_token
      - if: vars.IMAGE_REGISTRY != ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ vars.IMAGE_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.gcp.outputs.access_token }}
      # Pushed when a registry is set up; otherwise exported as an OCI layout on the runner, which still yields the digest.
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: EXTRA_REQUIREMENTS=${{ matrix.extra }}
          tags: ${{ vars.IMAGE_REGISTRY != '' && format('{0}/{1}:{2}', vars.IMAGE_REGISTRY, matrix.name, github.ref_name) || format('{0}:{1}', matrix.name, github.ref_name) }}
          outputs: ${{ vars.IMAGE_REGISTRY != '' && 'type=image,push=true' || format('type=oci,dest={0}/image.tar', runner.temp) }}
          provenance: mode=max
      - name: Record the digest
        env:
          NAME: ${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$DIGEST" in sha256:*) ;; *) echo "No digest for $NAME" >&2; exit 1 ;; esac
          echo "$NAME $TAG $DIGEST $GITHUB_SHA" | tee digests.txt
          echo "\`$NAME:$TAG\` \`$DIGEST\` (commit \`$GITHUB_SHA\`${REGISTRY:+, pushed to $REGISTRY})" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.name }}
          path: digests.txt
